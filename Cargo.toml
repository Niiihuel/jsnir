[package]
name = "jsnir"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
examples = []
stepper = []

[[example]]
name = "layout"
required-features = ["examples"]

[[example]]
name = "bridge_bench"
required-features = ["stepper"]

[[example]]
name = "frame_bench"
required-features = ["stepper"]

[[example]]
name = "sdk_bench"
required-features = ["stepper"]

[dependencies]
cosmic-text = "=0.14.2"
rquickjs = "=0.14.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
taffy = { version = "=0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
unicode-segmentation = "1"

