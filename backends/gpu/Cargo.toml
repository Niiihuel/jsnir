[package]
name = "jsnir-gpu"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
examples = ["jsnir/examples"]
stepper = ["jsnir/stepper", "dep:serde_json"]

[dependencies]
jsnir = { path = "../..", default-features = false, features = ["engine-quickjs"] }
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "=0.4.0"
serde_json = { version = "1", optional = true }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "gles", "vulkan", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }

